<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Белка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --felt-dark:#173324;
    --felt-light:#1f4632;
    --gold:#c9a13b;
    --gold-dim:#8a7233;
    --card-cream:#f4ecd8;
    --card-cream-edge:#e2d5b3;
    --ink:#2a2420;
    --red:#a33131;
    --wood:#4a3323;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; height:100%; overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 40%, var(--felt-light), var(--felt-dark) 75%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--card-cream);
    user-select:none;
  }
  .table{
    position:relative;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    justify-content:space-between;
  }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px 0;
  }
  .trump{
    display:flex; align-items:center; gap:8px;
    background:rgba(0,0,0,0.25);
    border:1px solid var(--gold-dim);
    border-radius:999px;
    padding:6px 14px;
    font-size:14px; letter-spacing:.3px;
  }
  .trump .suit{font-size:18px;}
  .score{
    display:flex; gap:14px;
    font-size:13px;
    background:rgba(0,0,0,0.25);
    border-radius:999px;
    padding:6px 16px;
    border:1px solid rgba(201,161,59,0.3);
  }
  .score span.num{color:var(--gold); font-weight:600; margin-left:4px;}
  .opponents{
    display:flex; justify-content:center; gap:56px;
    margin-top:6px;
  }
  .opp-hand{ display:flex; }
  .back-card{
    width:34px; height:48px;
    margin-left:-16px;
    border-radius:5px;
    background:
      repeating-linear-gradient(135deg, var(--gold-dim) 0 3px, #6e5620 3px 6px);
    border:1px solid var(--gold-dim);
    box-shadow:0 2px 4px rgba(0,0,0,.4);
  }
  .back-card:first-child{margin-left:0;}
  .opp-label{
    text-align:center; font-size:11px; color:var(--gold);
    margin-top:4px; opacity:.85;
  }
  .trick{
    flex:1;
    display:flex; align-items:center; justify-content:center;
    gap:10px;
    position:relative;
  }
  .trick .placeholder{
    font-size:12px; color:rgba(244,236,216,0.35);
    letter-spacing:.5px;
  }
  .handzone{
    position:relative;
    height:158px;
    display:flex; justify-content:center;
    padding-bottom:14px;
  }
  .hand{
    position:relative;
    width:100%; max-width:480px;
    height:100%;
  }
  .card{
    position:absolute;
    bottom:0; left:50%;
    width:58px; height:84px;
    background:var(--card-cream);
    border:1px solid var(--card-cream-edge);
    border-radius:8px;
    box-shadow:0 3px 6px rgba(0,0,0,.5);
    transform-origin:bottom center;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:6px 6px;
    transition:transform .18s ease, box-shadow .18s ease, margin-bottom .18s ease;
    cursor:pointer;
  }
  .card .rank{ font-size:16px; font-weight:700; line-height:1; color:var(--ink); }
  .card .suit-big{
    align-self:center; font-size:22px; margin-top:-4px; color:var(--ink);
  }
  .card .rank.bottom{ align-self:flex-end; transform:rotate(180deg); }
  .card.red .rank, .card.red .suit-big{ color:var(--red); }
  .card.trump-card{
    border:1.5px solid var(--gold);
    box-shadow:0 3px 8px rgba(201,161,59,.45), 0 3px 6px rgba(0,0,0,.5);
  }
  .card.selected{
    margin-bottom:26px;
    box-shadow:0 8px 14px rgba(0,0,0,.55);
  }
  .hint{
    text-align:center;
    font-size:11px;
    color:rgba(244,236,216,0.4);
    padding-bottom:8px;
    letter-spacing:.3px;
  }
  .waiting{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px;
    background:radial-gradient(ellipse at 50% 40%, var(--felt-light), var(--felt-dark) 75%);
    z-index:50;
  }
  .waiting .dots{ font-size:15px; letter-spacing:.4px; color:var(--card-cream); }
  .waiting .count{ font-size:34px; font-weight:700; color:var(--gold); }
  .waiting .sub{ font-size:12px; color:rgba(244,236,216,0.5); }
  .menu-btn{
    font-family:inherit;
    font-size:15px;
    color:var(--card-cream);
    background:rgba(0,0,0,0.28);
    border:1px solid var(--gold-dim);
    border-radius:12px;
    padding:14px 28px;
    width:240px;
    cursor:pointer;
  }
  .menu-btn:active{ background:rgba(0,0,0,0.45); }
  .code-input{
    font-family:inherit;
    font-size:22px;
    letter-spacing:4px;
    text-align:center;
    text-transform:uppercase;
    width:160px;
    padding:10px 0;
    border-radius:10px;
    border:1px solid var(--gold-dim);
    background:rgba(0,0,0,0.28);
    color:var(--card-cream);
  }
  .code-input::placeholder{ color:rgba(244,236,216,0.35); letter-spacing:2px; }
  .room-code{
    font-size:14px; color:var(--card-cream);
    background:rgba(0,0,0,0.28);
    border:1px solid var(--gold-dim);
    border-radius:10px;
    padding:8px 16px;
  }
  .room-code span{ color:var(--gold); font-weight:700; letter-spacing:3px; }
  .back-btn{ align-self:flex-start; margin-bottom:10px; padding:8px 16px; font-size:13px; width:auto; }
  .room-item{
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(0,0,0,0.28);
    border:1px solid var(--gold-dim);
    border-radius:10px;
    padding:12px 16px;
    cursor:pointer;
  }
  .room-item .creator{ font-size:14px; }
  .room-item .count{ font-size:13px; color:var(--gold); font-weight:600; }
  .disabled-card{ opacity:0.4; filter:grayscale(60%); }
  .trick-card{
    position:absolute;
    width:50px; height:72px;
    background:var(--card-cream);
    border:1px solid var(--card-cream-edge);
    border-radius:7px;
    box-shadow:0 3px 6px rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px;
    font-weight:700;
  }
  .trick-card .rank{ font-size:14px; color:var(--ink); }
  .trick-card .suit-big{ font-size:16px; color:var(--ink); }
  .trick-card.red .rank, .trick-card.red .suit-big{ color:var(--red); }
  .trick-bottom{ transform:translateY(38px); }
  .trick-top{ transform:translateY(-38px); }
  .trick-left{ transform:translateX(-52px); }
  .trick-right{ transform:translateX(52px); }
</style>
</head>
<body>

<div class="waiting" id="menu">
  <div class="dots" style="font-size:20px; font-weight:700; color:var(--gold); margin-bottom:6px;">Белка</div>
  <button class="menu-btn" id="btnRandom">Играть со случайными</button>
  <button class="menu-btn" id="btnSolo">Играть с ботами</button>
  <button class="menu-btn" id="btnCreateRoom">Создать комнату</button>
  <button class="menu-btn" id="btnBrowseRooms">Присоединиться к комнате</button>
  <button class="menu-btn" id="btnGoPrivate">Приватная комната</button>
</div>

<div class="waiting" id="privateScreen" style="display:none;">
  <button class="menu-btn back-btn" id="btnBackFromPrivate">‹ Назад</button>
  <div class="dots" style="font-size:16px;">Приватная комната</div>
  <button class="menu-btn" id="btnCreatePrivate">Создать приватную</button>
  <div style="display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:4px;">
    <input id="codeInput" maxlength="5" placeholder="КОД" class="code-input">
    <button class="menu-btn" id="btnJoinPrivate">Войти по коду</button>
  </div>
</div>

<div class="waiting" id="roomListScreen" style="display:none;">
  <button class="menu-btn back-btn" id="btnBackFromList">‹ Назад</button>
  <div class="dots" style="font-size:16px;">Открытые комнаты</div>
  <div id="roomListItems" style="display:flex; flex-direction:column; gap:10px; width:260px; max-height:50vh; overflow-y:auto;"></div>
  <div class="sub" id="roomListEmpty">Пока никто не создал комнату</div>
</div>

<div class="waiting" id="waiting" style="display:none;">
  <div class="count" id="waitingCount">1 / 4</div>
  <div class="dots" id="waitingLabel">Ожидаем игроков за столом…</div>
  <div class="sub" id="waitingSub"></div>
  <div class="room-code" id="roomCodeBox" style="display:none;">
    Код комнаты: <span id="roomCodeText"></span>
  </div>
</div>

<div class="table">

  <div class="topbar">
    <div class="trump"><span class="suit" id="trumpSuitIcon">♦</span><span id="trumpLabel">Козырь: бубны</span></div>
    <div class="score">Мы<span class="num" id="scoreUs">0</span> · Они<span class="num" id="scoreThem">0</span></div>
  </div>
  <div class="topbar" style="padding-top:0;">
    <div class="score" style="font-size:11px; opacity:0.8;">Партия — глаза (до 12): Мы<span class="num" id="eyesUs">0</span> · Они<span class="num" id="eyesThem">0</span></div>
  </div>

  <div class="opponents">
    <div>
      <div class="opp-hand" id="oppLeft"></div>
      <div class="opp-label">Айдос</div>
    </div>
    <div>
      <div class="opp-hand" id="oppTop"></div>
      <div class="opp-label">Динара</div>
    </div>
    <div>
      <div class="opp-hand" id="oppRight"></div>
      <div class="opp-label">Ержан</div>
    </div>
  </div>

  <div class="trick" id="trick">
    <span class="placeholder">ходов пока нет</span>
  </div>

  <div class="handzone">
    <div class="hand" id="hand"></div>
  </div>
  <div class="hint">Нажми на карту, чтобы выбрать её для хода</div>

</div>

<div class="waiting" id="dealResult" style="display:none;">
  <div class="dots" style="font-size:18px;">Раздача окончена</div>
  <div class="count" id="dealResultText" style="font-size:22px; white-space:pre-line;">Мы: 0 — Они: 0</div>
  <button class="menu-btn" id="btnPlayAgain">В меню</button>
</div>
<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const SUITS = {
    '♠':{color:'black'}, '♣':{color:'black'},
    '♦':{color:'red'},   '♥':{color:'red'}
  };
  let TRUMP_SUIT = '♦'; // overwritten once the real deal comes from Firebase

  // ---------------- Firebase ----------------
  const firebaseConfig = {
    apiKey: "AIzaSyC0vQ0YTBEj2-SeS5Iz0FnDCDTtDWsXMNY",
    authDomain: "belka-game-4a0fd.firebaseapp.com",
    databaseURL: "https://belka-game-4a0fd-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "belka-game-4a0fd",
    storageBucket: "belka-game-4a0fd.firebasestorage.app",
    messagingSenderId: "976969560919",
    appId: "1:976969560919:web:df825947854a329d954412"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  const myId = tgUser ? String(tgUser.id) : (sessionStorage.getItem('guestId') || (() => {
    const id = 'guest_' + Math.random().toString(36).slice(2, 9);
    sessionStorage.setItem('guestId', id);
    return id;
  })());
  const myName = tgUser ? (tgUser.first_name || 'Игрок') : 'Гость';

  let mySeat = null;
  let roomRef = null;

  const RANKS = ['7','8','9','10','J','Q','K','A'];
  const SUIT_LIST = ['♠','♣','♦','♥'];

  function buildShuffledDeck(){
    const deck = [];
    for (const s of SUIT_LIST) for (const r of RANKS) deck.push({rank:r, suit:s});
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    return deck;
  }

  let matchState = null; // { personalSuit, dealNumber, dealerSeat, eyes:{us,them} } — lives only on the dealing client

  function dealAndWriteHands(){
    if (!matchState) {
      matchState = { personalSuit: null, dealNumber: 1, dealerSeat: 0, eyes: { us: 0, them: 0 } };
    }
    const deck = buildShuffledDeck();
    const hands = [[], [], [], []];
    for (let seat = 0; seat < 4; seat++) {
      hands[seat] = deck.slice(seat * 8, seat * 8 + 8);
    }

    let clubsJackSeat = 0;
    for (let seat = 0; seat < 4; seat++) {
      if (hands[seat].some(c => c.rank === 'J' && c.suit === '♣')) { clubsJackSeat = seat; break; }
    }

    let trumpSuit;
    if (matchState.dealNumber === 1) {
      trumpSuit = '♣';
      matchState.personalSuit = {};
      matchState.personalSuit[clubsJackSeat] = '♣';
      matchState.personalSuit[(clubsJackSeat + 1) % 4] = '♥';
      matchState.personalSuit[(clubsJackSeat + 2) % 4] = '♠';
      matchState.personalSuit[(clubsJackSeat + 3) % 4] = '♦';
    } else {
      trumpSuit = matchState.personalSuit[clubsJackSeat];
    }

    roomRef.update({
      hands: hands,
      trumpSuit: trumpSuit,
      status: 'dealt',
      dealerSeat: matchState.dealerSeat,
      dealNumber: matchState.dealNumber
    });
    db.ref('public_rooms/' + roomRef.key).remove();
  }

  function tryMatchmake(){
    db.ref('lobby/lock').transaction(locked => locked ? undefined : true, (error, committed) => {
      if (error || !committed) return;
      db.ref('lobby/queue').once('value').then(qSnap => {
        const queue = qSnap.val() || {};
        const entries = Object.keys(queue).map(id => ({ id, ...queue[id] }));
        entries.sort((a, b) => (a.joinedAt || 0) - (b.joinedAt || 0));
        if (entries.length >= 4) {
          const chosen = entries.slice(0, 4);
          const newRoomKey = db.ref('rooms').push().key;
          const players = {};
          chosen.forEach((p, seat) => { players[seat] = { id: p.id, name: p.name }; });
          const updates = {};
          updates['rooms/' + newRoomKey + '/players'] = players;
          chosen.forEach(p => {
            updates['lobby/queue/' + p.id] = null;
            updates['lobby/assignments/' + p.id] = newRoomKey;
          });
          return db.ref().update(updates);
        }
      }).finally(() => db.ref('lobby/lock').set(false));
    });
  }

  function showScreen(id){
    ['menu', 'privateScreen', 'roomListScreen', 'waiting'].forEach(s => {
      document.getElementById(s).style.display = (s === id) ? 'flex' : 'none';
    });
  }

  function generateRoomCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 5; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
  }

  document.getElementById('btnRandom').addEventListener('click', () => {
    document.getElementById('waitingLabel').textContent = 'Ожидаем игроков за столом…';
    showScreen('waiting');
    db.ref('lobby/queue/' + myId).set({ name: myName, joinedAt: firebase.database.ServerValue.TIMESTAMP });
    db.ref('lobby/queue').on('value', snap => {
      const queue = snap.val() || {};
      if (!roomRef) {
        document.getElementById('waitingCount').textContent = Math.min(Object.keys(queue).length, 4) + ' / 4';
      }
      tryMatchmake();
    });
    db.ref('lobby/assignments/' + myId).on('value', snap => {
      const roomId = snap.val();
      if (roomId && !roomRef) {
        roomRef = db.ref('rooms/' + roomId);
        joinAssignedRoom();
      }
    });
  });

  function joinAssignedRoom(){
    roomRef.child('players').once('value').then(playersSnap => {
      const players = playersSnap.val() || {};
      for (const seat in players) {
        if (players[seat] && players[seat].id === myId) mySeat = Number(seat);
      }
      attachRoomListeners();
    });
  }

  function joinRoomBySeat(){
    roomRef.child('players').transaction(players => {
      players = players || {};
      for (const seat in players) {
        if (players[seat] && players[seat].id === myId) return players;
      }
      for (let seat = 0; seat < 4; seat++) {
        if (!players[seat]) { players[seat] = { id: myId, name: myName }; return players; }
      }
      return players;
    }, (error, committed, snapshot) => {
      if (error) { console.error('join failed', error); return; }
      const players = snapshot.val() || {};
      for (const seat in players) {
        if (players[seat] && players[seat].id === myId) mySeat = Number(seat);
      }
      if (mySeat !== null) {
        roomRef.child('players/' + mySeat).onDisconnect().remove();
      }
      if (mySeat === null) {
        document.getElementById('waitingSub').textContent = 'Комната уже заполнена (максимум 4 игрока).';
        return;
      }
      attachRoomListeners();
    });
  }

  document.getElementById('btnSolo').addEventListener('click', () => {
    const roomKey = db.ref('rooms').push().key;
    roomRef = db.ref('rooms/' + roomKey);
    mySeat = 0;
    const players = {
      0: { id: myId, name: myName },
      1: { id: 'bot_1', name: 'Бот Айдос', bot: true },
      2: { id: 'bot_2', name: 'Бот Динара', bot: true },
      3: { id: 'bot_3', name: 'Бот Ержан', bot: true }
    };
    document.getElementById('waitingLabel').textContent = 'Сажаем ботов за стол…';
    document.getElementById('waitingSub').textContent = '';
    document.getElementById('roomCodeBox').style.display = 'none';
    showScreen('waiting');
    roomRef.child('players').set(players).then(attachRoomListeners);
  });

  document.getElementById('btnCreateRoom').addEventListener('click', () => {
    const roomKey = db.ref('rooms').push().key;
    roomRef = db.ref('rooms/' + roomKey);
    const publicRoomRef = db.ref('public_rooms/' + roomKey);
    publicRoomRef.set({ creatorName: myName, createdAt: firebase.database.ServerValue.TIMESTAMP });
    publicRoomRef.onDisconnect().remove();
    document.getElementById('waitingLabel').textContent = 'Комната создана — ждём игроков';
    document.getElementById('waitingSub').textContent = 'Другие увидят её в списке открытых комнат';
    document.getElementById('roomCodeBox').style.display = 'none';
    showScreen('waiting');
    joinRoomBySeat();
  });

  document.getElementById('btnBackFromList').addEventListener('click', () => {
    db.ref('public_rooms').off('value');
    showScreen('menu');
  });

  document.getElementById('btnBrowseRooms').addEventListener('click', () => {
    showScreen('roomListScreen');
    db.ref('public_rooms').on('value', snap => {
      const rooms = snap.val() || {};
      const listEl = document.getElementById('roomListItems');
      const emptyEl = document.getElementById('roomListEmpty');
      const ids = Object.keys(rooms);
      listEl.innerHTML = '';
      emptyEl.style.display = ids.length ? 'none' : 'block';
      ids.forEach(roomId => {
        const item = document.createElement('div');
        item.className = 'room-item';
        item.innerHTML = `<span class="creator">Комната ${rooms[roomId].creatorName}</span><span class="count" id="count_${roomId}">…</span>`;
        item.addEventListener('click', () => {
          db.ref('public_rooms').off('value');
          roomRef = db.ref('rooms/' + roomId);
          document.getElementById('waitingLabel').textContent = 'Ожидаем игроков за столом…';
          document.getElementById('waitingSub').textContent = '';
          document.getElementById('roomCodeBox').style.display = 'none';
          showScreen('waiting');
          joinRoomBySeat();
        });
        listEl.appendChild(item);
        db.ref('rooms/' + roomId + '/players').on('value', pSnap => {
          const count = Object.keys(pSnap.val() || {}).length;
          const countEl = document.getElementById('count_' + roomId);
          if (countEl) countEl.textContent = count + ' / 4';
        });
      });
    });
  });

  document.getElementById('btnGoPrivate').addEventListener('click', () => showScreen('privateScreen'));
  document.getElementById('btnBackFromPrivate').addEventListener('click', () => showScreen('menu'));

  document.getElementById('btnCreatePrivate').addEventListener('click', () => {
    const code = generateRoomCode();
    roomRef = db.ref('rooms/priv_' + code);
    document.getElementById('waitingLabel').textContent = 'Ожидаем игроков за столом…';
    document.getElementById('roomCodeBox').style.display = 'block';
    document.getElementById('roomCodeText').textContent = code;
    document.getElementById('waitingSub').textContent = 'Отправь этот код друзьям';
    showScreen('waiting');
    joinRoomBySeat();
  });

  document.getElementById('btnJoinPrivate').addEventListener('click', () => {
    const code = document.getElementById('codeInput').value.trim().toUpperCase();
    if (code.length < 4) return;
    roomRef = db.ref('rooms/priv_' + code);
    document.getElementById('waitingLabel').textContent = 'Ожидаем игроков за столом…';
    document.getElementById('roomCodeBox').style.display = 'none';
    document.getElementById('waitingSub').textContent = '';
    showScreen('waiting');
    joinRoomBySeat();
  });

  function attachRoomListeners(){
    roomRef.on('value', snap => {
      const room = snap.val() || {};
      const players = room.players || {};
      const seatsFilled = Object.keys(players).length;

      document.getElementById('waitingCount').textContent = seatsFilled + ' / 4';

      const order = [1, 2, 3].map(offset => (mySeat + offset) % 4);
      const labelIds = ['oppLeft', 'oppTop', 'oppRight'];
      order.forEach((seat, i) => {
        const p = players[seat];
        const labelEl = document.querySelector('#' + labelIds[i]).parentElement.querySelector('.opp-label');
        labelEl.textContent = p ? p.name : 'Ожидание…';
        renderOpponentBacks(document.getElementById(labelIds[i]), p ? 8 : 0);
      });

      if (room.status === 'dealt' && room.hands && room.hands[mySeat]) {
        document.getElementById('waiting').style.display = 'none';
        roomRef.child('players/' + mySeat).onDisconnect().cancel();
        TRUMP_SUIT = room.trumpSuit;
        document.getElementById('trumpSuitIcon').textContent = TRUMP_SUIT;
        const trumpNames = {'♠':'пики', '♣':'трефы', '♦':'бубны', '♥':'червы'};
        document.getElementById('trumpLabel').textContent = 'Козырь: ' + trumpNames[TRUMP_SUIT];
        renderHand(room.hands[mySeat]);

        const isBotGame = Object.values(players).some(p => p && p.bot);
        if (isBotGame && room.dealNumber !== lastEngineDealNumber) {
          lastEngineDealNumber = room.dealNumber;
          startBotEngine(room);
        }
      } else if (seatsFilled === 4 && mySeat === 0 && room.status !== 'dealt') {
        dealAndWriteHands();
      }
    });
  }

  function renderOpponentBacks(el, count){
    el.innerHTML = '';
    for(let i=0;i<count;i++){
      const d = document.createElement('div');
      d.className = 'back-card';
      el.appendChild(d);
    }
  }

  const CARD_W = 58;

  function cardTransform(dx, angle, lifted){
    const lift = lifted ? -30 : 0;
    return `translateX(-50%) translateX(${dx}px) rotate(${angle}deg) translateY(${lift}px)`;
  }

  function renderHand(cards){
    const hand = document.getElementById('hand');
    hand.innerHTML = '';
    const n = cards.length;
    if (n === 0) return;

    const containerWidth = hand.clientWidth || 340;
    const maxUsableWidth = containerWidth - 12;
    const idealOffset = CARD_W - 6;
    const fitOffset = n > 1 ? (maxUsableWidth - CARD_W) / (n - 1) : 0;
    const offset = n > 1 ? Math.min(idealOffset, fitOffset) : 0;

    const maxTotalAngle = Math.min(14, n * 1.6);
    const angleStep = n > 1 ? maxTotalAngle / (n - 1) : 0;

    cards.forEach((c, i) => {
      const dx = (i - (n - 1) / 2) * offset;
      const angle = (i - (n - 1) / 2) * angleStep;
      const el = document.createElement('div');
      const isRed = SUITS[c.suit].color === 'red';
      const isTrumpCard = c.suit === TRUMP_SUIT || c.rank === 'J';
      el.className = 'card' + (isRed ? ' red' : '') + (isTrumpCard ? ' trump-card' : '');
      el.style.transform = cardTransform(dx, angle, false);
      el.style.zIndex = i;
      el.innerHTML = `
        <div class="rank">${c.rank}<br>${c.suit}</div>
        <div class="suit-big">${c.suit}</div>
        <div class="rank bottom">${c.rank}<br>${c.suit}</div>
      `;
      el.addEventListener('click', () => {
        if (gameState && gameState.turn === mySeat && isCardLegal(c)) {
          playCard(mySeat, c);
          return;
        }
        const wasSelected = el.classList.contains('selected');
        hand.querySelectorAll('.card.selected').forEach(x => {
          x.classList.remove('selected');
          x.style.transform = cardTransform(parseFloat(x.dataset.dx), parseFloat(x.dataset.angle), false);
        });
        if (!wasSelected) {
          el.classList.add('selected');
          el.style.transform = cardTransform(dx, angle, true);
          hand.appendChild(el);
        }
      });
      if (gameState && gameState.turn === mySeat && !isCardLegal(c)) {
        el.classList.add('disabled-card');
      }
      el.dataset.dx = dx;
      el.dataset.angle = angle;
      hand.appendChild(el);
    });
  }

  let lastRenderedHand = [];
  const _renderHand = renderHand;
  renderHand = function(cards){ lastRenderedHand = cards; _renderHand(cards); };
  window.addEventListener('resize', () => { if (lastRenderedHand.length) _renderHand(lastRenderedHand); });

  let gameState = null;
  let lastEngineDealNumber = 0;

  const RANK_ORDER = { '7':0, '8':1, '9':2, '10':3, 'Q':4, 'K':5, 'A':6 };
  const JACK_ORDER = { '♣':0, '♠':1, '♥':2, '♦':3 };
  const CARD_POINTS = { '7':0, '8':0, '9':0, '10':10, 'Q':3, 'K':4, 'A':11, 'J':2 };

  function cardPoints(card){ return CARD_POINTS[card.rank]; }

  function trickCardPower(card, ledSuit, trumpSuit){
    if (card.rank === 'J') return 1000 + JACK_ORDER[card.suit];
    if (card.suit === trumpSuit) return 500 + RANK_ORDER[card.rank];
    if (ledSuit && card.suit === ledSuit) return RANK_ORDER[card.rank];
    return -1;
  }

  function isTrump(card, trumpSuit){ return card.rank === 'J' || card.suit === trumpSuit; }
  function effectiveGroup(card, trumpSuit){ return isTrump(card, trumpSuit) ? 'TRUMP' : card.suit; }
  function hasGroup(hand, group, trumpSuit){ return hand.some(c => effectiveGroup(c, trumpSuit) === group); }

  function canPlay(hand, card, ledGroup, trumpSuit, ledSuitsPlayed){
    if (!ledGroup) return true;
    if (hasGroup(hand, ledGroup, trumpSuit)) {
      return effectiveGroup(card, trumpSuit) === ledGroup;
    }
    if (effectiveGroup(card, trumpSuit) === 'TRUMP') return true;
    if (card.rank === 'A' && !ledSuitsPlayed.has(card.suit)) return false;
    return true;
  }

  function isCardLegal(card){
    if (!gameState) return true;
    return canPlay(gameState.hands[mySeat], card, gameState.ledGroup, gameState.trumpSuit, gameState.ledSuitsPlayed);
  }

  function partnerSeat(seat){ return (seat + 2) % 4; }
  function isMyTeam(seat){ return seat === mySeat || seat === partnerSeat(mySeat); }

  function startBotEngine(room){
    gameState = {
      hands: JSON.parse(JSON.stringify(room.hands)),
      trumpSuit: room.trumpSuit,
      dealerSeat: room.dealerSeat,
      clubsJackTeamThisDeal: null,
      ledSuit: null,
      ledGroup: null,
      ledSuitsPlayed: new Set(),
      trick: [],
      leader: (room.dealerSeat + 1) % 4,
      turn: null,
      scores: { us: 0, them: 0 },
      trickCounts: { us: 0, them: 0 },
      trickNum: 0
    };
    for (let seat = 0; seat < 4; seat++) {
      if (gameState.hands[seat].some(c => c.rank === 'J' && c.suit === '♣')) {
        gameState.clubsJackTeamThisDeal = isMyTeam(seat) ? 'us' : 'them';
        break;
      }
    }
    gameState.turn = gameState.leader;
    updateScoreUI();
    renderTrickArea();
    scheduleTurn();
  }

  function scheduleTurn(){
    renderHand(gameState.hands[mySeat]);
    if (gameState.turn !== mySeat) {
      setTimeout(botPlay, 600 + Math.random() * 500);
    }
  }

  function botPlay(){
    const seat = gameState.turn;
    const options = gameState.hands[seat].filter(c => canPlay(gameState.hands[seat], c, gameState.ledGroup, gameState.trumpSuit, gameState.ledSuitsPlayed));
    const card = options[Math.floor(Math.random() * options.length)];
    playCard(seat, card);
  }

  function playCard(seat, card){
    const hand = gameState.hands[seat];
    const idx = hand.findIndex(c => c.rank === card.rank && c.suit === card.suit);
    hand.splice(idx, 1);
    if (gameState.trick.length === 0) {
      gameState.ledSuit = (card.rank === 'J') ? null : card.suit;
      gameState.ledGroup = effectiveGroup(card, gameState.trumpSuit);
      if (card.rank !== 'J') gameState.ledSuitsPlayed.add(card.suit);
    }
    gameState.trick.push({ seat, card });
    renderTrickArea();
    if (seat === mySeat) renderHand(gameState.hands[mySeat]);

    if (gameState.trick.length === 4) {
      setTimeout(resolveTrick, 900);
    } else {
      gameState.turn = (seat + 1) % 4;
      scheduleTurn();
    }
  }

  function resolveTrick(){
    let best = gameState.trick[0];
    let bestPower = trickCardPower(best.card, gameState.ledSuit, gameState.trumpSuit);
    for (let i = 1; i < 4; i++) {
      const p = trickCardPower(gameState.trick[i].card, gameState.ledSuit, gameState.trumpSuit);
      if (p > bestPower) { bestPower = p; best = gameState.trick[i]; }
    }
    const points = gameState.trick.reduce((sum, t) => sum + cardPoints(t.card), 0);
    const winnerTeam = isMyTeam(best.seat) ? 'us' : 'them';
    gameState.scores[winnerTeam] += points;
    gameState.trickCounts[winnerTeam]++;
    gameState.trickNum++;
    gameState.trick = [];
    gameState.ledSuit = null;
    gameState.ledGroup = null;
    updateScoreUI();

    if (gameState.trickNum === 8) {
      finishDeal();
    } else {
      gameState.leader = best.seat;
      gameState.turn = best.seat;
      renderTrickArea();
      scheduleTurn();
    }
  }

  function otherTeam(team){ return team === 'us' ? 'them' : 'us'; }

  function finishDeal(){
    const s = gameState.scores;

    if (gameState.trickCounts.us === 0 || gameState.trickCounts.them === 0) {
      const winner = gameState.trickCounts.us === 0 ? 'them' : 'us';
      matchState.eyes[winner] = 12;
      showDealSummary(`Взяли всё! ${winner === 'us' ? 'Мы' : 'Они'} получают все 12 глаз.`);
      return;
    }

    if (s.us === 60 && s.them === 60) {
      matchState.replayFor4 = true;
      showDealSummary('Ничья 60:60 — переигровка, на кону 4 глаза.', true);
      return;
    }

            const winnerTeam = s.us > s.them ? 'us' : 'them';
    const loserTeam = otherTeam(winnerTeam);
    const spasReached = s[loserTeam] >= 31;
    const trumpWithWinner = gameState.clubsJackTeamThisDeal === winnerTeam;

    let eyes;
    if (matchState.dealNumber === 1) {
      eyes = 2; // первая раздача матча всегда даёт ровно 2 глаза
    } else if (trumpWithWinner) {
      eyes = spasReached ? 1 : 2;
    } else {
      eyes = spasReached ? 2 : 3;
    }

    if (matchState.replayFor4) { eyes = 4; matchState.replayFor4 = false; }


    matchState.eyes[winnerTeam] += eyes;
    showDealSummary(`${winnerTeam === 'us' ? 'Мы' : 'Они'} берут ${eyes} ${eyes === 1 ? 'глаз' : (eyes < 5 ? 'глаза' : 'глаз')} (${s.us}:${s.them}${spasReached ? ', спас есть' : ''})`);
  }

  function updateScoreUI(){
    document.getElementById('scoreUs').textContent = gameState.scores.us;
    document.getElementById('scoreThem').textContent = gameState.scores.them;
    if (matchState) {
      document.getElementById('eyesUs').textContent = matchState.eyes.us;
      document.getElementById('eyesThem').textContent = matchState.eyes.them;
    }
  }

  const seatPositionClass = { 0: 'trick-bottom', 1: 'trick-left', 2: 'trick-top', 3: 'trick-right' };

  function renderTrickArea(){
    const trickEl = document.getElementById('trick');
    trickEl.innerHTML = '';
    if (!gameState || gameState.trick.length === 0) {
      trickEl.innerHTML = '<span class="placeholder">' + (gameState ? 'ждём ход…' : 'ходов пока нет') + '</span>';
      return;
    }
    gameState.trick.forEach(({ seat, card }) => {
      const relSeat = (seat - mySeat + 4) % 4;
      const el = document.createElement('div');
      const isRed = SUITS[card.suit].color === 'red';
      el.className = 'trick-card ' + seatPositionClass[relSeat] + (isRed ? ' red' : '');
      el.innerHTML = `<div class="rank">${card.rank}</div><div class="suit-big">${card.suit}</div>`;
      trickEl.appendChild(el);
    });
  }

  function showDealSummary(text, isReplay){
    if (matchState.eyes.us >= 12 || matchState.eyes.them >= 12) {
      showMatchEnd(text);
      return;
    }
    const overlay = document.getElementById('dealResult');
    document.getElementById('dealResultText').textContent = text;
    document.getElementById('btnPlayAgain').textContent = isReplay ? 'Переигровка' : 'Следующая раздача';
    overlay.style.display = 'flex';
  }

  function showMatchEnd(lastDealText){
    const winner = matchState.eyes.us >= 12 ? 'Мы' : 'Они';
    const overlay = document.getElementById('dealResult');
    document.getElementById('dealResultText').textContent =
      `${lastDealText}\n\n${winner} выигрывают партию! (${matchState.eyes.us} : ${matchState.eyes.them})`;
    document.getElementById('btnPlayAgain').textContent = 'В меню';
    overlay.style.display = 'flex';
    overlay.dataset.matchOver = 'true';
  }

  document.getElementById('btnPlayAgain').addEventListener('click', () => {
    const overlay = document.getElementById('dealResult');
    const matchOver = overlay.dataset.matchOver === 'true';
    overlay.style.display = 'none';
    overlay.dataset.matchOver = 'false';

    if (matchOver) {
      gameState = null;
      matchState = null;
      lastEngineDealNumber = 0;
      roomRef = null;
      mySeat = null;
      showScreen('menu');
      return;
    }

    matchState.dealNumber++;
    matchState.dealerSeat = (matchState.dealerSeat + 1) % 4;
    dealAndWriteHands();
  });
</script>
