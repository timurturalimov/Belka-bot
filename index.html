<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Белка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --felt-dark:#173324;
    --felt-light:#1f4632;
    --gold:#c9a13b;
    --gold-dim:#8a7233;
    --card-cream:#f4ecd8;
    --card-cream-edge:#e2d5b3;
    --ink:#2a2420;
    --red:#a33131;
    --wood:#4a3323;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; height:100%; overflow:hidden;
    background: radial-gradient(ellipse at 50% 40%, var(--felt-light), var(--felt-dark) 75%);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--card-cream);
    user-select:none;
  }
  .table{ position:relative; width:100%; height:100%; display:flex; flex-direction:column; justify-content:space-between; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px 0; }
  .trump{ display:flex; align-items:center; gap:8px; background:rgba(0,0,0,0.25); border:1px solid var(--gold-dim); border-radius:999px; padding:6px 14px; font-size:14px; }
  .trump .suit{font-size:18px;}
  .score{ display:flex; gap:14px; font-size:13px; background:rgba(0,0,0,0.25); border-radius:999px; padding:6px 16px; border:1px solid rgba(201,161,59,0.3); }
  .score span.num{color:var(--gold); font-weight:600; margin-left:4px;}
  .opponents{ display:flex; justify-content:center; gap:56px; margin-top:6px; }
  .opp-hand{ display:flex; }
  .back-card{
    width:34px; height:48px; margin-left:-16px; border-radius:5px;
    background: repeating-linear-gradient(135deg, var(--gold-dim) 0 3px, #6e5620 3px 6px);
    border:1px solid var(--gold-dim); box-shadow:0 2px 4px rgba(0,0,0,.4);
  }
  .back-card:first-child{margin-left:0;}
  .opp-label{ text-align:center; font-size:11px; color:var(--gold); margin-top:4px; opacity:.85; }
  .trick{ flex:1; display:flex; align-items:center; justify-content:center; gap:10px; position:relative; }
  .trick .placeholder{ font-size:12px; color:rgba(244,236,216,0.35); }
  .handzone{ position:relative; height:158px; display:flex; justify-content:center; padding-bottom:14px; }
  .hand{ position:relative; width:100%; max-width:480px; height:100%; }
  .card{
    position:absolute; bottom:0; left:50%; width:58px; height:84px;
    background:var(--card-cream); border:1px solid var(--card-cream-edge); border-radius:8px;
    box-shadow:0 3px 6px rgba(0,0,0,.5); transform-origin:bottom center;
    display:flex; flex-direction:column; justify-content:space-between; padding:6px 6px;
    transition:transform .18s ease, box-shadow .18s ease, margin-bottom .18s ease; cursor:pointer;
  }
  .card .rank{ font-size:16px; font-weight:700; line-height:1; color:var(--ink); }
  .card .suit-big{ align-self:center; font-size:22px; margin-top:-4px; color:var(--ink); }
  .card .rank.bottom{ align-self:flex-end; transform:rotate(180deg); }
  .card.red .rank, .card.red .suit-big{ color:var(--red); }
  .card.trump-card{ border:1.5px solid var(--gold); box-shadow:0 3px 8px rgba(201,161,59,.45), 0 3px 6px rgba(0,0,0,.5); }
  .card.selected{ margin-bottom:26px; box-shadow:0 8px 14px rgba(0,0,0,.55); }
  .hint{ text-align:center; font-size:11px; color:rgba(244,236,216,0.4); padding-bottom:8px; }
  .waiting{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; background:radial-gradient(ellipse at 50% 40%, var(--felt-light), var(--felt-dark) 75%); z-index:50;
  }
  .waiting .dots{ font-size:15px; color:var(--card-cream); }
  .waiting .count{ font-size:34px; font-weight:700; color:var(--gold); }
  .waiting .sub{ font-size:12px; color:rgba(244,236,216,0.5); }
  .menu-btn{
    font-family:inherit; font-size:15px; color:var(--card-cream); background:rgba(0,0,0,0.28);
    border:1px solid var(--gold-dim); border-radius:12px; padding:14px 28px; width:240px; cursor:pointer;
  }
  .menu-btn:active{ background:rgba(0,0,0,0.45); }
  .code-input{
    font-family:inherit; font-size:22px; letter-spacing:4px; text-align:center; text-transform:uppercase;
    width:160px; padding:10px 0; border-radius:10px; border:1px solid var(--gold-dim); background:rgba(0,0,0,0.28); color:var(--card-cream);
  }
  .code-input::placeholder{ color:rgba(244,236,216,0.35); }
  .room-code{ font-size:14px; color:var(--card-cream); background:rgba(0,0,0,0.28); border:1px solid var(--gold-dim); border-radius:10px; padding:8px 16px; }
  .room-code span{ color:var(--gold); font-weight:700; letter-spacing:3px; }
  .back-btn{ align-self:flex-start; margin-bottom:10px; padding:8px 16px; font-size:13px; width:auto; }
  .room-item{ display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.28); border:1px solid var(--gold-dim); border-radius:10px; padding:12px 16px; cursor:pointer; }
  .room-item .creator{ font-size:14px; }
  .room-item .count{ font-size:13px; color:var(--gold); font-weight:600; }
  .disabled-card{ opacity:0.4; filter:grayscale(60%); pointer-events:none; }
  .trick-card{
    position:absolute; width:50px; height:72px; background:var(--card-cream); border:1px solid var(--card-cream-edge);
    border-radius:7px; box-shadow:0 3px 6px rgba(0,0,0,.5); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-weight:700;
  }
  .trick-card .rank{ font-size:14px; color:var(--ink); }
  .trick-card .suit-big{ font-size:16px; color:var(--ink); }
  .trick-card.red .rank, .trick-card.red .suit-big{ color:var(--red); }
  .trick-bottom{ transform:translateY(38px); }
  .trick-top{ transform:translateY(-38px); }
  .trick-left{ transform:translateX(-52px); }
  .trick-right{ transform:translateX(52px); }
</style>
</head>
<body>

<div class="waiting" id="menu">
  <div class="dots" style="font-size:20px; font-weight:700; color:var(--gold); margin-bottom:6px;">Белка</div>
  <button class="menu-btn" id="btnRandom">Играть со случайными</button>
  <button class="menu-btn" id="btnSolo">Играть с ботами</button>
  <button class="menu-btn" id="btnCreateRoom">Создать комнату</button>
  <button class="menu-btn" id="btnBrowseRooms">Присоединиться к комнате</button>
  <button class="menu-btn" id="btnGoPrivate">Приватная комната</button>
</div>

<div class="waiting" id="privateScreen" style="display:none;">
  <button class="menu-btn back-btn" id="btnBackFromPrivate">‹ Назад</button>
  <div class="dots" style="font-size:16px;">Приватная комната</div>
  <button class="menu-btn" id="btnCreatePrivate">Создать приватную</button>
  <div style="display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:4px;">
    <input id="codeInput" maxlength="5" placeholder="КОД" class="code-input">
    <button class="menu-btn" id="btnJoinPrivate">Войти по коду</button>
  </div>
</div>

<div class="waiting" id="roomListScreen" style="display:none;">
  <button class="menu-btn back-btn" id="btnBackFromList">‹ Назад</button>
  <div class="dots" style="font-size:16px;">Открытые комнаты</div>
  <div id="roomListItems" style="display:flex; flex-direction:column; gap:10px; width:260px; max-height:50vh; overflow-y:auto;"></div>
  <div class="sub" id="roomListEmpty">Пока никто не создал комнату</div>
</div>

<div class="waiting" id="waiting" style="display:none;">
  <div class="count" id="waitingCount">1 / 4</div>
  <div class="dots" id="waitingLabel">Ожидаем игроков за столом…</div>
  <div class="sub" id="waitingSub"></div>
  <div class="room-code" id="roomCodeBox" style="display:none;">
    Код комнаты: <span id="roomCodeText"></span>
  </div>
</div>

<div class="table">
  <div class="topbar">
    <div class="trump"><span class="suit" id="trumpSuitIcon">♦</span><span id="trumpLabel">Козырь: бубны</span></div>
    <div class="score">Мы<span class="num" id="scoreUs">0</span> · Они<span class="num" id="scoreThem">0</span></div>
  </div>
  <div class="topbar" style="padding-top:0;">
    <div class="score" style="font-size:11px; opacity:0.8;">Партия — глаза (до 12): Мы<span class="num" id="eyesUs">0</span> · Они<span class="num" id="eyesThem">0</span></div>
  </div>

  <div class="opponents">
    <div>
      <div class="opp-hand" id="oppLeft"></div>
      <div class="opp-label">Айдос</div>
    </div>
    <div>
      <div class="opp-hand" id="oppTop"></div>
      <div class="opp-label">Динара</div>
    </div>
    <div>
      <div class="opp-hand" id="oppRight"></div>
      <div class="opp-label">Ержан</div>
    </div>
  </div>

  <div class="trick" id="trick">
    <span class="placeholder">ходов пока нет</span>
  </div>

  <div class="handzone">
    <div class="hand" id="hand"></div>
  </div>
  <div class="hint">Нажми на карту, чтобы выбрать её для хода</div>
</div>

<div class="waiting" id="dealResult" style="display:none;">
  <div class="dots" style="font-size:18px;">Раздача окончена</div>
  <div class="count" id="dealResultText" style="font-size:22px; white-space:pre-line;">Мы: 0 — Они: 0</div>
  <button class="menu-btn" id="btnPlayAgain">В меню</button>
</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const SUITS = { '♠':{color:'black'}, '♣':{color:'black'}, '♦':{color:'red'}, '♥':{color:'red'} };
  let TRUMP_SUIT = '♦';

  const firebaseConfig = {
    apiKey: "AIzaSyC0vQ0YTBEj2-SeS5Iz0FnDCDTtDWsXMNY",
    authDomain: "belka-game-4a0fd.firebaseapp.com",
    databaseURL: "https://belka-game-4a0fd-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "belka-game-4a0fd",
    storageBucket: "belka-game-4a0fd.firebasestorage.app",
    messagingSenderId: "976969560919",
    appId: "1:976969560919:web:df825947854a329d954412"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  const myId = tgUser ? String(tgUser.id) : (sessionStorage.getItem('guestId') || (() => {
    const id = 'guest_' + Math.random().toString(36).slice(2, 9);
    sessionStorage.setItem('guestId', id);
    return id;
  })());
  const myName = tgUser ? (tgUser.first_name || 'Игрок') : 'Гость';

  let mySeat = null;
  let roomRef = null;

  const RANKS = ['7','8','9','10','J','Q','K','A'];
  const SUIT_LIST = ['♠','♣','♦','♥'];
  const RANK_ORDER = { '7':0, '8':1, '9':2, '10':3, 'Q':4, 'K':5, 'A':6 };
  const JACK_ORDER = { '♦':0, '♥':1, '♠':2, '♣':3 };
  const CARD_POINTS = { '7':0, '8':0, '9':0, '10':10, 'Q':3, 'K':4, 'A':11, 'J':2 };

  function buildShuffledDeck(){
    const deck = [];
    for (const s of SUIT_LIST) for (const r of RANKS) deck.push({rank:r, suit:s});
    for (let i = deck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [deck[i], deck[j]] = [deck[j], deck[i]];
    }
    return deck;
  }

  function sortHand(hand, trumpSuit) {
    const suitOrder = { '♠': 0, '♣': 1, '♦': 2, '♥': 3 };
    return hand.slice().sort((a, b) => {
      const aIsTrump = a.rank === 'J' || a.suit === trumpSuit;
      const bIsTrump = b.rank === 'J' || b.suit === trumpSuit;
      if (aIsTrump && !bIsTrump) return 1;
      if (!aIsTrump && bIsTrump) return -1;
      if (!aIsTrump && !bIsTrump) {
        if (a.suit !== b.suit) return suitOrder[a.suit] - suitOrder[b.suit];
        return RANK_ORDER[a.rank] - RANK_ORDER[b.rank];
      }
      if (a.rank === 'J' && b.rank !== 'J') return 1;
      if (a.rank !== 'J' && b.rank === 'J') return -1;
      if (a.rank === 'J' && b.rank === 'J') return JACK_ORDER[a.suit] - JACK_ORDER[b.suit];
      return RANK_ORDER[a.rank] - RANK_ORDER[b.rank];
    });
  }

  function dealAndWriteHands(){
    roomRef.child('match').once('value').then(matchSnap => {
      let match = matchSnap.val() || { dealNumber: 1, dealerSeat: 0, personalSuit: {}, eyes: { 0: 0, 1: 0 } };
      const deck = buildShuffledDeck();
      const hands = [[], [], [], []];
      for (let seat = 0; seat < 4; seat++) hands[seat] = deck.slice(seat * 8, seat * 8 + 8);

      let clubsJackSeat = 0;
      for (let seat = 0; seat < 4; seat++) {
        if (hands[seat].some(c => c.rank === 'J' && c.suit === '♣')) { clubsJackSeat = seat; break; }
      }

      let trumpSuit;
      if (match.dealNumber === 1) {
        trumpSuit = '♣';
        match.personalSuit = {};
        match.personalSuit[clubsJackSeat] = '♣';
        match.personalSuit[(clubsJackSeat + 1) % 4] = '♥';
        match.personalSuit[(clubsJackSeat + 2) % 4] = '♠';
        match.personalSuit[(clubsJackSeat + 3) % 4] = '♦';
      } else {
        trumpSuit = match.personalSuit[clubsJackSeat] || '♣';
      }

      for (let seat = 0; seat < 4; seat++) {
        hands[seat] = sortHand(hands[seat], trumpSuit);
      }

      const deal = {
        hands, trumpSuit,
        dealNumber: match.dealNumber, dealerSeat: match.dealerSeat, turn: (match.dealerSeat + 1) % 4,
        trick: [], lastCompletedTrick: [], isTrickResolving: false,
        ledGroup: null, ledSuit: null, ledSuitsPlayed: [],
        scores: { 0: 0, 1: 0 }, trickCounts: { 0: 0, 1: 0 },
        clubsJackTeam: clubsJackSeat % 2, trickNum: 0, status: 'playing'
      };

      roomRef.update({ match, deal, status: 'dealt' });
      db.ref('public_rooms/' + roomRef.key).remove();
    });
  }

  function showScreen(id){
    ['menu', 'privateScreen', 'roomListScreen', 'waiting'].forEach(s => {
      document.getElementById(s).style.display = (s === id) ? 'flex' : 'none';
    });
  }

  document.getElementById('btnSolo').addEventListener('click', () => {
    const roomKey = db.ref('rooms').push().key;
    roomRef = db.ref('rooms/' + roomKey);
    mySeat = 0;
    const players = {
      0: { id: myId, name: myName },
      1: { id: 'bot_1', name: 'Бот Айдос', bot: true },
      2: { id: 'bot_2', name: 'Бот Динара', bot: true },
      3: { id: 'bot_3', name: 'Бот Ержан', bot: true }
    };
    document.getElementById('waitingLabel').textContent = 'Сажаем ботов за стол…';
    document.getElementById('waitingSub').textContent = '';
    document.getElementById('roomCodeBox').style.display = 'none';
    showScreen('waiting');
    roomRef.child('players').set(players).then(attachRoomListeners);
  });

  function attachRoomListeners(){
    roomRef.on('value', snap => {
      const room = snap.val() || {};
      const players = room.players || {};
      const seatsFilled = Object.keys(players).length;

      document.getElementById('waitingCount').textContent = seatsFilled + ' / 4';

      const order = [1, 2, 3].map(offset => (mySeat + offset) % 4);
      const labelIds = ['oppLeft', 'oppTop', 'oppRight'];
      order.forEach((seat, i) => {
        const p = players[seat];
        const labelEl = document.querySelector('#' + labelIds[i]).parentElement.querySelector('.opp-label');
        labelEl.textContent = p ? p.name : 'Ожидание…';
        const cardCount = (room.deal && room.deal.hands && room.deal.hands[seat]) ? room.deal.hands[seat].length : 0;
        renderOpponentBacks(document.getElementById(labelIds[i]), cardCount);
      });

      if (room.status === 'dealt' && room.deal && room.deal.hands && room.deal.hands[mySeat] !== undefined) {
        document.getElementById('waiting').style.display = 'none';
        TRUMP_SUIT = room.deal.trumpSuit;
        document.getElementById('trumpSuitIcon').textContent = TRUMP_SUIT;
        const trumpNames = {'♠':'пики', '♣':'трефы', '♦':'бубны', '♥':'червы'};
        document.getElementById('trumpLabel').textContent = 'Козырь: ' + trumpNames[TRUMP_SUIT];
        syncDealState(room, players);
      } else if (seatsFilled === 4 && mySeat === 0 && room.status !== 'dealt') {
        dealAndWriteHands();
      }
    });
  }

  function renderOpponentBacks(el, count){
    el.innerHTML = '';
    for(let i=0;i<count;i++){
      const d = document.createElement('div');
      d.className = 'back-card';
      el.appendChild(d);
    }
  }

  const CARD_W = 58;
  function cardTransform(dx, angle, lifted){
    return `translateX(-50%) translateX(${dx}px) rotate(${angle}deg) translateY(${lifted ? -30 : 0}px)`;
  }

  function renderHand(cards){
    const hand = document.getElementById('hand');
    hand.innerHTML = '';
    if (!cards || cards.length === 0) return;
    const n = cards.length;
    const containerWidth = hand.clientWidth || 340;
    const offset = n > 1 ? Math.min(CARD_W - 6, (containerWidth - 12 - CARD_W) / (n - 1)) : 0;
    const angleStep = n > 1 ? Math.min(14, n * 1.6) / (n - 1) : 0;

    cards.forEach((c, i) => {
      const dx = (i - (n - 1) / 2) * offset;
      const angle = (i - (n - 1) / 2) * angleStep;
      const el = document.createElement('div');
      const isRed = SUITS[c.suit].color === 'red';
      const isTrumpCard = c.suit === TRUMP_SUIT || c.rank === 'J';
      el.className = 'card' + (isRed ? ' red' : '') + (isTrumpCard ? ' trump-card' : '');
      el.style.transform = cardTransform(dx, angle, false);
      el.style.zIndex = i;
      el.innerHTML = `
        <div class="rank">${c.rank}<br>${c.suit}</div>
        <div class="suit-big">${c.suit}</div>
        <div class="rank bottom">${c.rank}<br>${c.suit}</div>
      `;
      
      const canClick = gameState && gameState.turn === mySeat && !gameState.isTrickResolving && isCardLegal(c);

      el.addEventListener('click', () => {
        if (canClick) {
          playCard(mySeat, c);
        }
      });

      if (!canClick) el.classList.add('disabled-card');
      el.dataset.dx = dx;
      el.dataset.angle = angle;
      hand.appendChild(el);
    });
  }

  let gameState = null;
  let botTimer = null;

  function cardPoints(card){ return CARD_POINTS[card.rank]; }
  function trickCardPower(card, ledSuit, trumpSuit){
    if (card.rank === 'J') return 1000 + JACK_ORDER[card.suit];
    if (card.suit === trumpSuit) return 500 + RANK_ORDER[card.rank];
    if (ledSuit && card.suit === ledSuit) return RANK_ORDER[card.rank];
    return -1;
  }

  function isTrump(card, trumpSuit){ return card.rank === 'J' || card.suit === trumpSuit; }
  function effectiveGroup(card, trumpSuit){ return isTrump(card, trumpSuit) ? 'TRUMP' : card.suit; }

  function legalCardsForHand(hand, ledGroup, trumpSuit, ledSuitsPlayed) {
    if (!hand || hand.length === 0) return [];
    if (!ledGroup) return hand.slice();

    const sameGroup = hand.filter(c => effectiveGroup(c, trumpSuit) === ledGroup);
    if (sameGroup.length > 0) return sameGroup;

    const trumps = hand.filter(c => effectiveGroup(c, trumpSuit) === 'TRUMP');
    const validDiscards = hand.filter(c => {
      if (effectiveGroup(c, trumpSuit) === 'TRUMP') return false; 
      const suitPlayed = (ledSuitsPlayed || []).includes(c.suit);
      const countInSuit = hand.filter(x => x.suit === c.suit).length;
      if (c.rank === 'A' && !suitPlayed && countInSuit > 1) return false; 
      return true;
    });

    const allowed = trumps.concat(validDiscards);
    return allowed.length > 0 ? allowed : hand.slice();
  }

  function canPlay(hand, card, ledGroup, trumpSuit, ledSuitsPlayed){
    const legal = legalCardsForHand(hand, ledGroup, trumpSuit, ledSuitsPlayed);
    return legal.some(c => c.suit === card.suit && c.rank === card.rank);
  }

  function isCardLegal(card){
    if (!gameState || !gameState.hands || !gameState.hands[mySeat]) return false;
    return canPlay(gameState.hands[mySeat], card, gameState.ledGroup, gameState.trumpSuit, gameState.ledSuitsPlayed);
  }

  function myTeam(){ return mySeat % 2; }

  function syncDealState(room, players){
    const deal = room.deal;
    gameState = deal;

    if (room.match) updateScoreUI(room);
    renderTrickArea();
    if (deal.hands) {
      renderHand(deal.hands[mySeat] || []);
    }

    if (deal.status === 'finished') {
      showDealSummary(room);
      return;
    } else {
      document.getElementById('dealResult').style.display = 'none';
    }

    if (deal.isTrickResolving) {
      if (mySeat === 0) {
        clearTimeout(botTimer);
        botTimer = setTimeout(() => finalizeTrickInDB(), 800);
      }
      return;
    }

    const turnPlayer = players[deal.turn];
    if (turnPlayer && turnPlayer.bot && mySeat === 0) {
      clearTimeout(botTimer);
      botTimer = setTimeout(() => botPlay(deal), 400);
    }
  }

  function botPlay(deal){
    const seat = deal.turn;
    const hand = deal.hands[seat];
    if (!hand || hand.length === 0) return;
    const options = legalCardsForHand(hand, deal.ledGroup, deal.trumpSuit, deal.ledSuitsPlayed);
    const card = options[Math.floor(Math.random() * options.length)];
    playCard(seat, card);
  }

  function playCard(seat, card) {
    roomRef.child('deal').transaction(deal => {
      if (!deal || deal.status === 'finished' || deal.isTrickResolving) return deal;
      if (deal.turn !== seat) return deal;

      deal.trick = deal.trick || [];
      const currentHand = deal.hands && deal.hands[seat] ? Array.from(deal.hands[seat]) : [];
      const idx = currentHand.findIndex(c => c && c.rank === card.rank && c.suit === card.suit);
      
      if (idx === -1) return deal;

      currentHand.splice(idx, 1);
      deal.hands[seat] = currentHand;

      if (deal.trick.length === 0) {
        deal.ledSuit = (card.rank === 'J') ? null : card.suit;
        deal.ledGroup = effectiveGroup(card, deal.trumpSuit);
        deal.ledSuitsPlayed = deal.ledSuitsPlayed || [];
        if (card.rank !== 'J' && !deal.ledSuitsPlayed.includes(card.suit)) {
          deal.ledSuitsPlayed.push(card.suit);
        }
      }
      
      deal.trick.push({ seat, card });

      if (deal.trick.length < 4) {
        deal.turn = (seat + 1) % 4;
        return deal;
      }

      deal.isTrickResolving = true;
      return deal;
    });
  }

  function finalizeTrickInDB() {
    roomRef.child('deal').transaction(deal => {
      if (!deal || !deal.isTrickResolving) return deal;

      let best = deal.trick[0];
      let bestPower = trickCardPower(best.card, deal.ledSuit, deal.trumpSuit);
      for (let i = 1; i < 4; i++) {
        const p = trickCardPower(deal.trick[i].card, deal.ledSuit, deal.trumpSuit);
        if (p > bestPower) { 
          bestPower = p; 
          best = deal.trick[i]; 
        }
      }

      const points = deal.trick.reduce((sum, t) => sum + cardPoints(t.card), 0);
      const winnerTeam = best.seat % 2;
      
      deal.scores = deal.scores || { 0: 0, 1: 0 };
      deal.trickCounts = deal.trickCounts || { 0: 0, 1: 0 };
      
      deal.scores[winnerTeam] = (deal.scores[winnerTeam] || 0) + points;
      deal.trickCounts[winnerTeam] = (deal.trickCounts[winnerTeam] || 0) + 1;
      deal.trickNum = (deal.trickNum || 0) + 1;

      deal.trick = [];
      deal.ledSuit = null;
      deal.ledGroup = null;
      deal.turn = best.seat;
      deal.isTrickResolving = false;

      if (deal.trickNum >= 8) {
        deal.status = 'finished';
        const s = deal.scores;
        const winnerTeam2 = s[0] >= s[1] ? 0 : 1;
        deal.finishedWinnerTeam = winnerTeam2;
        deal.finishedEyes = (s[0] === 60 && s[1] === 60) ? 0 : 2;
      }

      return deal;
    }, () => {
      if (mySeat === 0) applyDealResultIfNeeded();
    });
  }

  function applyDealResultIfNeeded(){
    roomRef.child('deal').transaction(deal => {
      if (!deal || deal.status !== 'finished' || deal.eyesApplied) return deal;
      deal.eyesApplied = true;
      return deal;
    }, (err, committed, snap) => {
      if (!committed || !snap.val() || !snap.val().eyesApplied) return;
      const deal = snap.val();
      roomRef.child('match').transaction(match => {
        if (!match) return match;
        match.eyes = match.eyes || { 0: 0, 1: 0 };
        match.eyes[deal.finishedWinnerTeam] = (match.eyes[deal.finishedWinnerTeam] || 0) + (deal.finishedEyes || 2);
        return match;
      });
    });
  }

  function updateScoreUI(room){
    const my = myTeam();
    const opp = 1 - my;
    document.getElementById('scoreUs').textContent = room.deal.scores[my] || 0;
    document.getElementById('scoreThem').textContent = room.deal.scores[opp] || 0;
    const eyes = (room.match && room.match.eyes) || { 0: 0, 1: 0 };
    document.getElementById('eyesUs').textContent = eyes[my] || 0;
    document.getElementById('eyesThem').textContent = eyes[opp] || 0;
  }

  const seatPositionClass = { 0: 'trick-bottom', 1: 'trick-left', 2: 'trick-top', 3: 'trick-right' };

  function renderTrickArea(){
    const trickEl = document.getElementById('trick');
    trickEl.innerHTML = '';
    const currentTrick = (gameState && gameState.trick) ? gameState.trick : [];

    if (!gameState || currentTrick.length === 0) {
      trickEl.innerHTML = '<span class="placeholder">' + (gameState ? 'ждём ход…' : 'ходов пока нет') + '</span>';
      return;
    }

    currentTrick.forEach(({ seat, card }) => {
      const relSeat = (seat - mySeat + 4) % 4;
      const el = document.createElement('div');
      const isRed = SUITS[card.suit].color === 'red';
      el.className = 'trick-card ' + seatPositionClass[relSeat] + (isRed ? ' red' : '');
      el.innerHTML = `<div class="rank">${card.rank}</div><div class="suit-big">${card.suit}</div>`;
      trickEl.appendChild(el);
    });
  }

  function showDealSummary(room){
    const deal = room.deal;
    const my = myTeam();
    const opp = 1 - my;
    const winnerIsMe = deal.finishedWinnerTeam === my;

    const overlay = document.getElementById('dealResult');
    document.getElementById('dealResultText').textContent = `${winnerIsMe ? 'Мы берём' : 'Они берут'} глаза!\nСчёт: Мы ${deal.scores[my]} — Они ${deal.scores[opp]}`;
    document.getElementById('btnPlayAgain').textContent = 'В меню';
    overlay.style.display = 'flex';
  }

  document.getElementById('btnPlayAgain').addEventListener('click', () => {
    document.getElementById('dealResult').style.display = 'none';
    gameState = null;
    roomRef = null;
    mySeat = null;
    showScreen('menu');
  });

  document.getElementById('btnRandom').addEventListener('click', () => showScreen('menu'));
  document.getElementById('btnCreateRoom').addEventListener('click', () => showScreen('menu'));
  document.getElementById('btnBrowseRooms').addEventListener('click', () => showScreen('menu'));
  document.getElementById('btnGoPrivate').addEventListener('click', () => showScreen('menu'));
  document.getElementById('btnBackFromPrivate').addEventListener('click', () => showScreen('menu'));
  document.getElementById('btnBackFromList').addEventListener('click', () => showScreen('menu'));
</script>
</body>
